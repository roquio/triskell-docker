services:

  opendj:
    build: opendj
    ports:
      - "1389:1389"
    volumes:
      - opendj-data:/opt/opendj/db

  cas:
    build: cas
    environment:
      - LDAP_HOST=opendj
    ports:
      - "8080"
    links:
      - opendj
    deploy:
      resources:
        limits:
          memory: 768m

  httpd:
    build: httpd
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST}
      - HTTPS_PROVIDED=false
      - CAS_HOST=cas
      - NUXEO_HOST=nuxeo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - httpd-ssl:/etc/ssl
    links:
      - cas
      - nuxeo

  postgres:
    build: postgres
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=nuxeo
      - POSTGRES_MULTIPLE_DATABASES=nuxeodb, modulodb, workspacesdb, notificationsdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          memory: 512m

  elasticsearch:
    image: elasticsearch:8.7.0
    environment:
      - cluster.name=es-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 50

  kafka:
    image: apache/kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://kafka:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    deploy:
      resources:
        limits:
          memory: 512m

  nuxeo:
    build:
      context: ./nuxeo
      args:
        BUILD_TAG: local-nuxeo-nuxeo
        SCM_REF: built-locally
        VERSION: latest-lts-2023
    ports:
      - "8081:8080"
      - "8787:8787"
    volumes:
      - nuxeo-data:/var/lib/nuxeo
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  kibana:
    image: kibana:8.7.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 512m


volumes:
  opendj-data:
  httpd-ssl:
  postgres-data:
  elasticsearch-data:
  nuxeo-data:
