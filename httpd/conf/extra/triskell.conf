<VirtualHost *:80>
    ServerName TRISKELL_PUBLIC_HOST

    ProxyPreserveHost On
    RewriteEngine On
    RewriteOptions Inherit

    DirectoryIndex /

    ProxyPass /api http://back-end:8080
    ProxyPassReverse /api http://back-end:8080

    <Location /api>
        # Ajout location après url du host
        RequestHeader set X-Forwarded-Prefix /api
    </Location>

    ProxyPass /nuxeo http://nuxeo:8080/nuxeo
    ProxyPassReverse /nuxeo http://nuxeo:8080/nuxeo

    ProxyPass /cas http://cas:8080/cas
    ProxyPassReverse /cas http://cas:8080/cas

    ProxyPass / http://front-end:80/
    ProxyPassReverse / http://front-end:80/
</VirtualHost>
